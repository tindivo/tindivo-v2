# Recorrido de una persona SIN sesión: portada → carta → plato → bolsa → primer punto que pide identificación.
# Corre contra staging (variante dev). Requiere un negocio abierto hoy en tindivo-dev (La Florencia E2E).
# Uso: maestro --device <serial> test --test-output-dir <carpeta> invitado-hasta-identificacion.yaml
appId: com.tindivo.customer.dev
---
- launchApp:
    clearState: true
- tapOn:
    text: "Reintentar"
    optional: true
- extendedWaitUntil:
    visible: "La Florencia E2E"
    timeout: 30000
- takeScreenshot: 01-inicio-invitado
- tapOn: "La Florencia E2E"
- extendedWaitUntil:
    visible: "Medio pollo"
    timeout: 15000
- takeScreenshot: 02-carta
- tapOn: "Medio pollo"
- extendedWaitUntil:
    visible: "Agregar.*"
    timeout: 10000
- takeScreenshot: 03-plato
- tapOn: "Agregar.*"
- tapOn: "Ver mi bolsa.*"
- extendedWaitUntil:
    visible: "Subtotal"
    timeout: 10000
- takeScreenshot: 04-bolsa
- tapOn: "Continuar(?! con| sin).*"
- extendedWaitUntil:
    visible: "Entra para pedir"
    timeout: 15000
- assertVisible: "Necesitas tu cuenta para confirmar el pedido.*"
- takeScreenshot: 05-identificacion
# Volver atrás: la bolsa debe seguir con el plato.
- back
- extendedWaitUntil:
    visible: "Subtotal"
    timeout: 10000
- assertVisible: "Medio pollo"
- takeScreenshot: 05b-volver-a-bolsa
