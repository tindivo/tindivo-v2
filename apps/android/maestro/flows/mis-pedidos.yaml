# «Mis pedidos»: portada con sesion → Mi cuenta → Mis pedidos → el historial lista pedidos o el vacio.
# No crea pedidos. Si corre despues de pedido-contraentrega.yaml, ese pedido aparece arriba.
# ESTADO: NO_EJECUTADO en dispositivo. Uso (desde apps/android/maestro): maestro test -e GOOGLE_EMAIL=<cuenta> flows/mis-pedidos.yaml
appId: com.tindivo.customer.dev
---
- launchApp
- tapOn:
    text: "Reintentar"
    optional: true
- extendedWaitUntil:
    visible: "Mi cuenta|Entrar"
    timeout: 30000
- runFlow:
    when:
      visible: "Entrar"
    commands:
      - tapOn: "Entrar"
      - tapOn: "Continuar con Google"
      - tapOn:
          text: "${GOOGLE_EMAIL}"
          optional: true
      - extendedWaitUntil:
          visible: "Mi cuenta"
          timeout: 30000
- tapOn: "Mi cuenta"
- extendedWaitUntil:
    visible: "Mis pedidos"
    timeout: 10000
- takeScreenshot: m01-mi-cuenta
- tapOn: "Mis pedidos"
- extendedWaitUntil:
    visible: "Historial de pedidos"
    timeout: 15000
- assertNotVisible: "Algo salió mal.*"
- assertNotVisible: "No pudimos.*"
- takeScreenshot: m02-historial
- back
- assertVisible: "Mi cuenta"
