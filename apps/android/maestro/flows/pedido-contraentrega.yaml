# Pedido en contraentrega (efectivo) hasta ver el seguimiento en su estado inicial.
# Corre contra staging (tindivo-dev), variante dev. Crea UN pedido en tindivo-dev por corrida; un cliente solo puede
# tener un pedido activo por negocio: si queda uno colgado, cancelalo desde la app antes de repetir.
# Uso (desde apps/android/maestro):
#   maestro --device <serial> test -e GOOGLE_EMAIL=<cuenta> --test-output-dir <carpeta> flows/pedido-contraentrega.yaml
# ESTADO: escrito contra los textos de strings.xml; NO_EJECUTADO en dispositivo (no habia emulador ni tablet).
appId: com.tindivo.customer.dev
env:
  NEGOCIO: "La Florencia E2E"
  PLATO: "Medio pollo"
  NOMBRE_CLIENTE: "Cliente Maestro"
---
# Sin clearState: la sesion de Google se conserva entre corridas.
- launchApp
- tapOn:
    text: "Reintentar"
    optional: true
- takeScreenshot: c01-inicio
- runFlow: ../subflows/agregar-plato-a-bolsa.yaml
- takeScreenshot: c02-bolsa
- runFlow: ../subflows/checkout-hasta-pago.yaml
- takeScreenshot: c03-checkout
- tapOn: "Efectivo"
# «Exacto» evita depender del vuelto disponible esa noche.
- tapOn:
    text: "Exacto"
    optional: true
- scrollUntilVisible:
    element: "Confirmar pedido ·.*"
    timeout: 10000
- takeScreenshot: c04-antes-de-confirmar
- tapOn: "Confirmar pedido ·.*"
# Un cliente sin historial nace «validando» (la cajera llama): hero «Pedido recibido». Con historial puede decir
# «Esperando confirmación de disponibilidad».
- extendedWaitUntil:
    visible: "Pedido recibido|Esperando confirmación.*"
    timeout: 30000
- assertVisible: "Recibido"
- takeScreenshot: c05-seguimiento-inicial
# Aqui termina el flujo: validar/aceptar y entregar el pedido lo hacen el negocio y el motorizado desde sus apps (ver el
# README, «Como se cierra el ciclo de un pedido hecho por la app»).
