# Subflujo: desde «Mi bolsa» pasa a «Confirmar pedido» con sesion y resuelve las hojas de lo que falte.
# Precondicion de datos (staging): la cuenta de prueba ya tiene celular VERIFICADO. El SMS no se automatiza:
# si aparece «Verifica tu celular» el flujo falla a proposito. Nombre y direccion se completan aqui si faltan.
# Termina con la seccion «¿Cómo pagas?» a la vista. Env: NOMBRE_CLIENTE.
appId: com.tindivo.customer.dev
---
- tapOn: "Continuar(?! con| sin).*"
- runFlow: identificarse-google.yaml
- extendedWaitUntil:
    visible: "Confirmar pedido"
    timeout: 20000
- runFlow:
    when:
      visible: "Agrega tu nombre"
    commands:
      - tapOn: "Agrega tu nombre"
      - tapOn: "Tu nombre"
      - inputText: "${NOMBRE_CLIENTE}"
      - hideKeyboard
      - tapOn: "Guardar"
# El mapa deja el pin fijo al centro; si hace falta moverlo, «Usar mi ubicación» pide permiso de GPS (emulador:
# fijar ubicacion en San Jacinto antes). NO VERIFICADO.
- runFlow:
    when:
      visible: "Agrega tu dirección"
    commands:
      - tapOn: "Agrega tu dirección"
      - tapOn: "Calle y número.*"
      - inputText: "Jr. Sucre 412"
      - tapOn: "Referencia.*"
      - inputText: "Frente a la bodega, casa de reja negra, prueba Maestro"
      - hideKeyboard
      - tapOn:
          text: "Usar mi ubicación"
          optional: true
      - tapOn: "Guardar dirección"
- assertNotVisible: "Verifica tu celular"
- scrollUntilVisible:
    element: "¿Cómo pagas?"
    timeout: 10000
