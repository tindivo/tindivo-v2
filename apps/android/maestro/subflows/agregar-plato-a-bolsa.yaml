# Subflujo: desde la portada abre el negocio, anade un plato y llega a «Mi bolsa».
# Env: NEGOCIO (La Florencia E2E), PLATO (Medio pollo).
# Plato con opciones: si el boton dice «Completa N opciones» se toca la primera opcion de cada grupo obligatorio.
# Esa parte NO ESTA VERIFICADA en dispositivo; el plato por defecto de staging no tiene grupos obligatorios.
appId: com.tindivo.customer.dev
---
- extendedWaitUntil:
    visible: "${NEGOCIO}"
    timeout: 30000
- tapOn: "${NEGOCIO}"
- extendedWaitUntil:
    visible: "${PLATO}"
    timeout: 15000
- tapOn: "${PLATO}"
- extendedWaitUntil:
    visible: "(Agregar|Completa).*"
    timeout: 10000
- repeat:
    while:
      visible: "Completa.*"
    times: 4
    commands:
      - tapOn:
          text: "Elige una opción"
          optional: true
      - tapOn:
          text: "Incluido"
          optional: true
- tapOn: "Agregar.*"
- tapOn: "Ver mi bolsa"
- extendedWaitUntil:
    visible: "Subtotal"
    timeout: 10000
