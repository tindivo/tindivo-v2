# Subflujo: deja la sesion iniciada. No hace nada si ya hay sesion (los flujos no usan clearState).
# Requiere -e GOOGLE_EMAIL=<cuenta Google de prueba ya anadida al dispositivo>.
# NO VERIFICADO EN DISPOSITIVO: el selector de cuentas lo pinta Google Play services y su texto puede variar.
# Google Sign-In real no se automatiza bien (README, lista manual): si falla aqui, entra a mano una vez y
# vuelve a lanzar los flujos; la sesion persiste entre corridas.
appId: com.tindivo.customer.dev
---
- runFlow:
    when:
      visible: "Entra para pedir"
    commands:
      - tapOn: "Entrar"
      - extendedWaitUntil:
          visible: "Entrar a Tindivo"
          timeout: 10000
      - tapOn: "Continuar con Google"
      - tapOn:
          text: "${GOOGLE_EMAIL}"
          optional: true
      - extendedWaitUntil:
          notVisible: "Entrar a Tindivo"
          timeout: 30000
