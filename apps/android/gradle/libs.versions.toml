# Catálogo de versiones de apps/android (KT-1, KT-16). Cada versión es exacta, tiene al menos dos semanas y la aprobó
# Jesús el 2026-10-22 (lista en Docs/arquitectura/estandares/kotlin.md, KT-16). Subir una versión es un cambio aparte,
# que se prueba en su propio PR.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
navigationCompose = "2.10.2"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
okhttp = "5.5.0"
# Coil (D-54): imágenes del catálogo. Pide OkHttp 4.12 como mínimo; Gradle resuelve el 5.5.0 de arriba.
coil = "3.6.3"
kotlinxSerialization = "1.11.0"
coroutines = "1.11.0"
datastore = "1.2.1"
openapiGenerator = "7.25.0"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
# detekt corre por su CLI en la CI (android.yml), no como plugin: la 1.23.8 está compilada con Kotlin 2.0 y chocaría
# con el Kotlin del proyecto. La versión vive aquí para que haya una sola fuente.
detekt = "1.23.8"
junit = "4.13.2"
# Pruebas instrumentadas (EVID-01): la sesión contra el Android Keystore real, en emulador.
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
# Sesión (D-54, opción REST): Auth por su API REST con el OkHttp de la app, Credential Manager y Tink. Todas con más
# de dos semanas de publicadas. tink-android 1.24.0 no: tiene diez días.
credentials = "1.6.0"
googleid = "1.2.1"
tink = "1.23.0"
# Mapa de Google (D-54, KT-16): el formulario de direcciones. play-services-maps 20.1.0 (2026-10-13) y maps-compose 9.0.1
# (2026-10-08) tienen más de dos semanas; maps-compose 9.0.1 se compila contra Compose BOM 2026.09.00 y Kotlin 2.4.20, los
# mismos de aquí.
playServicesMaps = "20.1.0"
mapsCompose = "9.0.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
