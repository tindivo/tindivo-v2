name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/contracts/openapi/v1.json'
      - 'scripts/sync-openapi.sh'
      - 'scripts/android-check-manifest.py'
      - 'scripts/android-size-report.py'
      - '.github/workflows/android.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/android/**'
      - 'packages/contracts/openapi/v1.json'
      - 'scripts/sync-openapi.sh'
      - 'scripts/android-check-manifest.py'
      - 'scripts/android-size-report.py'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Sin secretos y con permisos de solo lectura: este job compila y prueba, no firma ni publica (KT-15: la firma llega
# con Play App Signing). Construye `devDebug` y, solo para medir su peso de descarga (D-57), el AAB `prodRelease` sin
# firmar con R8 y reducción de recursos; ese AAB no se sube ni se publica.
permissions:
  contents: read

# El runner va fijado a `ubuntu-24.04` por la misma razón que en ci.yml: una imagen nueva no puede cambiar el resultado
# sin un commit que lo diga. Las versiones de AGP, Kotlin y Gradle viven en apps/android/gradle/libs.versions.toml y en
# el wrapper; aquí solo se fijan JDK, acciones y las CLI de ktlint, detekt y bundletool.
#
# Qué se verifica y en qué se confía (CAX-005): las acciones van fijadas por SHA completo (una etiqueta se puede mover;
# subir una es un cambio aparte); el wrapper de Gradle lo valida setup-gradle contra los checksums de Gradle y la
# distribución, el `distributionSha256Sum`; los jars de ktlint, detekt y bundletool, su sha256 de aquí. Las dependencias de Gradle
# (AGP, Kotlin, AndroidX, OkHttp…) llegan por HTTPS desde Google Maven, Maven Central y el portal de plugins de Gradle,
# con la versión exacta del catálogo, pero SIN verificación de dependencias de Gradle (verification-metadata.xml): ahí
# se confía en esos repositorios. Es el límite aceptado: ni el APK de depuración ni el AAB release salen de la CI
# (el AAB solo se mide y se descarta; al informe de tamaño se suben únicamente cifras).
env:
  DETEKT_VERSION: 1.23.8
  # Hash del `detekt-cli-1.23.8-all.jar` de Maven Central (repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/
  # detekt-cli/1.23.8/), calculado con sha256sum al descargarlo; su .sha1 publicado coincide. Subir de versión es
  # un cambio aparte: se recalcula este valor.
  DETEKT_SHA256: 3afe89a11120303c73c9bdda3d8fe558dd9070a6937d27819ddc04b275381245
  # El mismo ktlint que fija libs.versions.toml. Hash del `ktlint-cli-1.8.0-all.jar` de Maven Central
  # (repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/1.8.0/), calculado al descargarlo; su .sha1 publicado
  # coincide.
  KTLINT_VERSION: 1.8.0
  KTLINT_SHA256: 369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab
  # bundletool, para medir el peso de descarga del AAB (D-57). Hash del `bundletool-all-1.18.3.jar` de la release
  # oficial de GitHub (github.com/google/bundletool/releases/tag/1.18.3), calculado con sha256sum al descargarlo; coincide
  # con el digest que GitHub publica para ese asset (`gh api repos/google/bundletool/releases/latest`). Subir de
  # versión es un cambio aparte: se recalcula este valor.
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  android:
    name: Ktlint · detekt · Pruebas · Lint · APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CLI-1: el contrato que el generador lee en :core:network tiene que ser copia exacta del canónico.
      - name: Comprobar que el contrato OpenAPI está sincronizado
        run: bash scripts/sync-openapi.sh --check

      - name: Preparar JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Además de la caché de Gradle, esta acción valida el checksum del wrapper contra los publicados por Gradle.
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # La imagen del runner trae un SDK de Android, pero no hay garantía de que incluya la plataforma 37 (compileSdk)
      # ni las build-tools que pida AGP 9.4. Se aceptan las licencias para que AGP baje sola lo que le falte, y se
      # deja en el log qué plataformas quedaron instaladas.
      - name: Preparar el SDK de Android
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" --list_installed | grep -E 'platforms;|build-tools;' || true

      # ktlint va por su CLI, con el jar verificado por hash: el plugin de Gradle (14.2.0) no ve las fuentes del Kotlin
      # integrado de AGP 9, y en :customer y :core:designsystem su ktlintCheck pasaba sin revisar nada (medido en la
      # CI del PR #78). El plugin se queda para `ktlintFormat` en local.
      - name: Comprobar el estilo con ktlint
        working-directory: apps/android
        run: |
          JAR="${RUNNER_TEMP}/ktlint-cli-${KTLINT_VERSION}-all.jar"
          curl --fail --silent --show-error --location --output "${JAR}" \
            "https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/${KTLINT_VERSION}/ktlint-cli-${KTLINT_VERSION}-all.jar"
          echo "${KTLINT_SHA256}  ${JAR}" | sha256sum --check -
          java -jar "${JAR}" --relative '**/src/**/*.kt' '**/*.kts' '!**/build/**'

      # detekt 1.23.8 está compilado con Kotlin 2.0 y chocaría con el Kotlin del proyecto como plugin de Gradle: va
      # por su CLI, con el jar verificado por hash. Sin `--classpath` no hay resolución de tipos (KT-14: ver el
      # comentario de detekt.yml). La complejidad sale como alerta (peso 0) y no tumba el job.
      - name: Analizar con detekt
        run: |
          JAR="${RUNNER_TEMP}/detekt-cli-${DETEKT_VERSION}-all.jar"
          curl --fail --silent --show-error --location --output "${JAR}" \
            "https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          echo "${DETEKT_SHA256}  ${JAR}" | sha256sum --check -
          java -jar "${JAR}" \
            --config apps/android/config/detekt/detekt.yml \
            --build-upon-default-config \
            --input apps/android \
            --excludes '**/build/**'

      # KT-14 pide avisar a partir de 300 líneas por archivo. detekt 1.23.8 no trae una regla de longitud de archivo
      # (su `LargeClass` cuenta líneas de una clase), así que se mide aquí. Es solo una alerta: no falla el job.
      - name: Avisar de archivos largos (KT-14)
        run: |
          # Separado por NUL y con el nombre filtrado: un nombre de archivo no puede partir la lista ni colar otro
          # comando de workflow (`::`) en el aviso. Solo archivos regulares, y un fallo de lectura es otro aviso: este
          # paso nunca tumba el job.
          find apps/android -type f -name '*.kt' -not -path '*/build/*' -print0 | sort -z | while IFS= read -r -d '' file; do
            if ! lines=$(wc -l < "${file}" 2> /dev/null); then
              echo "::warning::KT-14: no se pudo leer un .kt para contar sus líneas"
              continue
            fi
            if [ "${lines}" -gt 300 ]; then
              case "${file}" in
                *[!A-Za-z0-9._/-]*) echo "::warning::KT-14: un .kt de ${lines} líneas con un nombre fuera de [A-Za-z0-9._/-]" ;;
                *) echo "::warning file=${file}::KT-14: ${lines} líneas (umbral de archivo 300, alerta)" ;;
              esac
            fi
          done

      # KT-6 pide `!!` como error. La regla de detekt que lo detecta necesita resolución de tipos (ver detekt.yml),
      # así que se comprueba aquí con grep sobre las fuentes propias (lo generado vive en build/ y no entra).
      - name: Prohibir el operador !!
        run: |
          if grep -rn --include='*.kt' --exclude-dir=build '!!' apps/android; then
            echo "::error::Hay usos de !! (KT-6). Usa un manejo explícito del null."
            exit 1
          fi

      - name: Pruebas unitarias
        working-directory: apps/android
        run: ./gradlew :core:network:test :customer:testDevDebugUnitTest

      - name: Android Lint
        working-directory: apps/android
        run: ./gradlew :customer:lintDevDebug :core:designsystem:lintDebug

      - name: Construir el APK dev debug
        working-directory: apps/android
        run: ./gradlew :customer:assembleDevDebug -PversionCode=${{ github.run_number }}

      # CAX-006: el manifiesto que cuenta es el del APK (fusionado con el de las librerías), no el fuente. Se vuelca del
      # propio APK, se compara con la lista permitida y queda junto al APK, con los hashes de los dos en el log.
      - name: Comprobar el manifiesto final del APK
        run: |
          APK=$(ls apps/android/customer/build/outputs/apk/dev/debug/*.apk)
          OUT=apps/android/customer/build/outputs/apk/dev/debug/AndroidManifest-final.xml
          "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest print "${APK}" > "${OUT}"
          sha256sum "${APK}" "${OUT}"
          python3 scripts/android-check-manifest.py "${OUT}" com.tindivo.customer.dev

      - name: Subir el APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tindivo-customer-dev-debug-${{ github.run_number }}
          path: |
            apps/android/customer/build/outputs/apk/dev/debug/*.apk
            apps/android/customer/build/outputs/apk/dev/debug/AndroidManifest-final.xml
          if-no-files-found: error
          retention-days: 14

      # D-57: el AAB prodRelease (R8 y reducción de recursos) se construye sin firmar y solo para medir su peso.
      - name: Construir el AAB prod release (sin firmar, solo para medir)
        working-directory: apps/android
        run: ./gradlew :customer:bundleProdRelease -PversionCode=${{ github.run_number }}

      # EVID-01: el manifiesto fusionado de prodRelease (el que entra al AAB), con la misma comprobación de superficie que
      # el del APK de depuración. El applicationId de prod no lleva sufijo (el de dev es com.tindivo.customer.dev). Se
      # guarda junto al informe de tamaño, con los hashes del AAB y del manifiesto en el log.
      - name: Comprobar el manifiesto final del AAB prod
        run: |
          MANIFESTS=$(find apps/android/customer/build/intermediates -path '*/merged_manifests/prodRelease/*' -name AndroidManifest.xml)
          if [ "$(printf '%s\n' "${MANIFESTS}" | grep -c .)" -ne 1 ]; then
            echo "Se esperaba exactamente un manifiesto fusionado de prodRelease; encontrados:"
            echo "${MANIFESTS:-(ninguno)}"
            exit 1
          fi
          AAB=$(ls apps/android/customer/build/outputs/bundle/prodRelease/*.aab)
          mkdir -p "${RUNNER_TEMP}/size"
          cp "${MANIFESTS}" "${RUNNER_TEMP}/size/AndroidManifest-prodRelease.xml"
          sha256sum "${AAB}" "${MANIFESTS}" "${RUNNER_TEMP}/size/AndroidManifest-prodRelease.xml"
          python3 scripts/android-check-manifest.py "${RUNNER_TEMP}/size/AndroidManifest-prodRelease.xml" com.tindivo.customer

      # D-57: tamaño de descarga que vería el usuario. `build-apks` genera el conjunto de APK del AAB (lo firma con la
      # clave de depuración que AGP ya creó, o lo deja sin firmar: el tamaño es el mismo; no hay claves ni secretos) y
      # `get-size total` calcula el mínimo y el máximo. Se mide (1) sobre todas las configuraciones de dispositivo y
      # (2) para un perfil de gama baja, versionado en apps/android/config/size/gama-baja.json: Android 8 (API 26, el
      # minSdk de D-47), ABIs arm64-v8a y armeabi-v7a, 320 dpi e idioma es, que representa a los usuarios de gama
      # baja y media de un pueblo de Áncash. El techo (config/size/budget.json) está en null: de momento solo se
      # informa, y se fija tras ver la medición real.
      - name: Medir el tamaño de descarga (D-57)
        run: |
          JAR="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --silent --show-error --location --output "${JAR}" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  ${JAR}" | sha256sum --check -
          AAB=$(ls apps/android/customer/build/outputs/bundle/prodRelease/*.aab)
          SIZE_DIR="${RUNNER_TEMP}/size"
          mkdir -p "${SIZE_DIR}"
          java -jar "${JAR}" build-apks --bundle="${AAB}" --output="${SIZE_DIR}/app.apks"
          java -jar "${JAR}" get-size total --apks="${SIZE_DIR}/app.apks" --dimensions=ALL \
            --human-readable-sizes=false > "${SIZE_DIR}/todas.csv"
          java -jar "${JAR}" get-size total --apks="${SIZE_DIR}/app.apks" \
            --device-spec=apps/android/config/size/gama-baja.json \
            --human-readable-sizes=false > "${SIZE_DIR}/gama-baja.csv"
          python3 scripts/android-size-report.py apps/android/config/size/budget.json \
            "${SIZE_DIR}/informe-tamano.md" "${SIZE_DIR}/todas.csv" "${SIZE_DIR}/gama-baja.csv"

      - name: Subir el informe de tamaño
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tindivo-customer-tamano-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/size/informe-tamano.md
            ${{ runner.temp }}/size/todas.csv
            ${{ runner.temp }}/size/gama-baja.csv
            ${{ runner.temp }}/size/AndroidManifest-prodRelease.xml
          if-no-files-found: error
          retention-days: 14

      - name: Subir los informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-informes-${{ github.run_number }}
          path: |
            apps/android/**/build/reports/tests/
            apps/android/**/build/reports/lint-results-*.html
            apps/android/**/build/reports/lint-results-*.xml
            apps/android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # EVID-01: la sesión contra el Android Keystore real. Las pruebas JVM usan Tink sin Keystore; estas corren en un
  # emulador (API 34, x86_64) y comprueban el cifrado de ida y vuelta y la destrucción de claves al borrar (CAX-004).
  # Sin acciones de terceros nuevas: el emulador se arma con las CLI del SDK que trae la imagen del runner.
  keystore:
    name: Keystore real en emulador
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Preparar el SDK de Android
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" --list_installed | grep -E 'platforms;|build-tools;' || true

      # Sin KVM el emulador x86_64 no arranca en un tiempo razonable.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar el emulador y la imagen del sistema
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" 'emulator' 'system-images;android-34;google_apis;x86_64'

      - name: Crear el dispositivo virtual
        run: |
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          echo no | "${AVDMANAGER}" create avd -n tindivo -k 'system-images;android-34;google_apis;x86_64' --device pixel_6 --force

      # Sin `adb wait-for-device`: espera sin plazo, y si el emulador no arranca el job se queda colgado hasta el
      # timeout sin mostrar por qué. El bucle tiene plazo y comprueba que el proceso sigue vivo.
      - name: Arrancar el emulador
        timeout-minutes: 8
        run: |
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${PATH}"
          ls -l /dev/kvm
          emulator -accel-check
          nohup emulator -avd tindivo -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          adb start-server
          booted=""
          for _ in $(seq 1 150); do
            if ! kill -0 "${EMULATOR_PID}" 2> /dev/null; then
              echo "::error::El emulador terminó antes de arrancar"
              break
            fi
            if [ "$(adb shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ -z "${booted}" ]; then
            echo "::error::El emulador no terminó de arrancar en 300 s"
            tail -n 80 "${RUNNER_TEMP}/emulator.log" || true
            exit 1
          fi
          adb shell input keyevent 82

      - name: Pruebas instrumentadas de la sesión
        timeout-minutes: 15
        working-directory: apps/android
        run: ./gradlew :customer:connectedDevDebugAndroidTest

      - name: Subir los informes del Keystore
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-keystore-informes-${{ github.run_number }}
          path: |
            apps/android/customer/build/reports/androidTests/
            apps/android/customer/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 14
