name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El runner va fijado a `ubuntu-24.04` y no a `ubuntu-latest`: desde el
# 2026-10-19, `ubuntu-latest` pasa a ser Ubuntu 26 (actions/runner-images#14748),
# y la suite de la API levanta Supabase en Docker sobre él. Una imagen nueva no
# puede cambiar el resultado del CI sin un commit que lo diga; subir de imagen
# es un cambio aparte, que se prueba en su propio PR.
#
# Las acciones van en su última versión mayor, todas sobre Node 24: las @v4 (y
# `supabase/setup-cli@v1`) eran de Node 20, que GitHub ya fuerza a 24 con un
# aviso en cada job. `setup-cli@v3` instala la CLI desde npm, no desde las
# releases de GitHub; la versión fijada sigue siendo la misma.
env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.15.9

jobs:
  quality:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Design system (superficies de botón fuera de @tindivo/ui)
        run: pnpm check:ds

      # El scope del signOut no lo ve ni Biome ni el type-check: un
      # `auth.signOut()` a secas compila, pasa lint y cierra la sesión del
      # usuario en TODOS sus dispositivos. Este paso es lo único que lo para.
      - name: Límites de sesión (signOut local · cliente de navegador)
        run: pnpm check:auth

      # Lo que manda (canon, planes, AGENTS.md/CLAUDE.md) no puede apuntar a archivos que no existen ni perder su
      # cabecera: así nació el `/specs` fantasma. Estándar: Docs/README.md §8.
      - name: Documentación que manda (enlaces, rutas y cabeceras)
        run: pnpm check:docs

      # Fronteras de arquitectura (ADR 0039): ninguna app cliente importa packages/backend, el backend no
      # importa next, domain/ no toca infra ni SDK, y un módulo solo importa el index de otro.
      - name: Fronteras de arquitectura (dependency-cruiser)
        run: pnpm check:deps

      - name: Type-check (incluye el drift de enums compile-time)
        run: pnpm type-check

      # @tindivo/api es de integración: su `vitest.global-setup.ts` barre
      # datos contra Supabase local (127.0.0.1:54321) antes y después de la
      # suite. Este runner no levanta esa base —ningún workflow lo ha hecho
      # nunca—, así que el paso fallaría con "fetch failed" pase lo que pase
      # en el código: no es una señal sobre el cambio que se está integrando.
      # Se corre a mano en local (`pnpm test`, con Docker arriba) y queda
      # cubierto por el review de dos etapas antes de mergear.
      - name: Test (Vitest — core + contracts, sin @tindivo/api)
        run: pnpm exec turbo run test --filter='!@tindivo/api'

      - name: Build
        run: pnpm build

  # Mecanismos de Docs/README.md §8 que no necesitan pnpm: referencias a git (etiquetas archive/* o ancestros de la rama
  # base) y revisión de los scripts de shell y de los workflows. `fetch-depth: 0` trae la historia y las etiquetas, que
  # check-archive-refs.sh necesita. `pnpm check:docs` (§8.1 a §8.4) corre en el job `quality`.
  docs:
    name: Docs · referencias a git · shellcheck · actionlint
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Referencias a git (etiquetas archive/* o ancestros de la rama base)
        run: bash scripts/check-archive-refs.sh "origin/${{ github.base_ref || github.ref_name }}"

      # shellcheck viene en la imagen del runner (ubuntu-24.04).
      - name: shellcheck (scripts de shell y hook)
        run: shellcheck scripts/*.sh .githooks/post-commit

      # Binario fijado por versión: el script de descarga es el del propio proyecto, en la misma etiqueta.
      - name: actionlint (workflows)
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color

  # La suite de @tindivo/api es de integración: necesita una Supabase de verdad.
  # Este job levanta una LOCAL en el runner, la reconstruye desde
  # supabase/migrations, siembra el mundo e2e y corre la suite sin caché. Nunca
  # toca tindivo-prod: no hay token ni contraseña en el job, `supabase start`
  # solo conoce el Docker del runner y los helpers de test abortan si la URL no
  # es 127.0.0.1 (apps/api/lib/__tests__/helpers/local-db.ts).
  # Plan de migraciones, lote P0.3.
  api-integration:
    name: Integración · API contra Supabase local
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Fijada: la misma versión con la que se reconstruye la base en local.
      SUPABASE_CLI_VERSION: 2.109.1
      # Redis real para probar el script Lua del tope de OTP por número
      # (apps/api/lib/__tests__/otp-phone-limit.redis.test.ts).
      REDIS_URL: redis://127.0.0.1:6379
      # Esta base es del runner, no compartida: aquí no hay otra sesión a la que
      # pisar, así que los tests no exigen el candado de `pnpm db:lock`. Junto con
      # `CI=true` (lo pone Actions) es la señal explícita de scripts/db-lock-guard.mjs.
      TINDIVO_DB_LOCK_BYPASS: ci-isolated-db
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Las suites se escribieron y se miden en Lima, y Vercel corre en UTC.
      # Aquí se reproduce la línea base local; si la suite depende de la zona
      # horaria, es un hallazgo aparte, no algo que este job deba esconder.
      - name: Zona horaria de Lima (la de la línea base local)
        run: sudo timedatectl set-timezone America/Lima

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # `start` sobre un runner vacío equivale a `db reset`: crea la base y
      # aplica todas las migraciones desde cero. Si una no reconstruye, cae aquí.
      - name: Supabase local (reconstruye desde las migraciones)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Credenciales del entorno levantado
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::API_URL no es local: $API_URL"; exit 1 ;;
          esac
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Mundo e2e
        run: pnpm db:seed:e2e

      - name: Suite de la API (sin caché)
        run: >
          pnpm exec turbo run test --filter=@tindivo/api --force --
          --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-results
          path: apps/api/test-results/
          if-no-files-found: warn

      - name: Diagnóstico de Supabase
        if: failure()
        run: |
          supabase status || true
          docker ps -a
          docker logs "$(docker ps -aqf name=supabase_db)" --tail 200 || true

  db-types-drift:
    name: DB types drift (database.types.ts vs Supabase)
    runs-on: ubuntu-24.04
    # `secrets` NO es un contexto válido en `if` de job (rechaza el workflow entero).
    # Se mapea a env y un step-guard condiciona los pasos siguientes.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: zpnipajgwfthxhdtzhly
    steps:
      - uses: actions/checkout@v7
      - name: Guard — ¿hay token de Supabase configurado?
        id: guard
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Sin SUPABASE_ACCESS_TOKEN; se omite el chequeo de drift."
          fi
      - uses: supabase/setup-cli@v3
        if: steps.guard.outputs.run == 'true'
        with:
          version: latest
      - name: Generar tipos desde la DB
        if: steps.guard.outputs.run == 'true'
        run: supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" --schema public > /tmp/database.types.ts
      - name: Verificar que no hay drift
        if: steps.guard.outputs.run == 'true'
        run: |
          if ! diff -q packages/supabase/src/database.types.ts /tmp/database.types.ts > /dev/null; then
            echo "::error::database.types.ts está desactualizado. Corre 'pnpm db:types' y commitea."
            diff packages/supabase/src/database.types.ts /tmp/database.types.ts || true
            exit 1
          fi
          echo "Sin drift: los tipos están sincronizados con la DB."

  # MV2c: los modelos de Kotlin se generan desde el contrato OpenAPI y se compilan en cada PR. Si un cambio del
  # contrato rompe la app Android, cae aquí y no al construir la app. Los de Swift se compilan a diario en
  # `mobile-models-swift.yml` (D-48: el runner de macOS cuesta diez veces más). Los modelos no se versionan.
  # Todo va fijado: generador (con sha256) y plugins en scripts/generate-mobile-models.mjs; JDK y Gradle, aquí.
  mobile-models-kotlin:
    name: Modelos móviles · Kotlin compila
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.1

      - name: Generar y compilar los modelos de Kotlin
        run: node scripts/generate-mobile-models.mjs kotlin --compile

  # Mecanismos baratos de los estándares (Docs/arquitectura/estandares/README.md §8). Todo va fijado a una versión
  # exacta: subir cualquiera es un cambio aparte, que se prueba en su propio PR.
  #  - Spectral: el estilo del contrato (API-1, API-4, API-5, API-8). Falla solo con errores; lo heredado que no
  #    cumple está en Docs/arquitectura/excepciones.md.
  #  - sync-openapi --check: las copias del contrato en las apps nativas (CLI-1). Omite las apps que aún no existen.
  #  - Excepciones: el número de filas de excepciones.md no puede subir contra la rama base. Si Jesús aprueba que
  #    suba, el PR lleva la etiqueta `excepciones-aprobadas`.
  #  - oasdiff: ningún cambio incompatible del contrato contra la rama base (DES-6, API-3).
  contract:
    name: Contrato · Spectral · oasdiff · excepciones
    runs-on: ubuntu-24.04
    env:
      SPECTRAL_CLI_VERSION: 6.17.0
      OASDIFF_VERSION: 1.32.1
      OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Spectral (estilo del contrato)
        run: >
          npx --yes "@stoplight/spectral-cli@${SPECTRAL_CLI_VERSION}" lint
          packages/contracts/openapi/v1.json --ruleset .spectral.yaml --fail-severity=error

      - name: Copias del contrato en las apps nativas
        run: scripts/sync-openapi.sh --check

      - name: Excepciones (el número solo puede bajar)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'excepciones-aprobadas')
        run: scripts/check-excepciones.sh "origin/${BASE_REF}"

      - name: oasdiff (cambios incompatibles del contrato)
        if: github.event_name == 'pull_request'
        run: |
          curl -fsSLo "$RUNNER_TEMP/oasdiff.tar.gz" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
          git show "origin/${BASE_REF}:packages/contracts/openapi/v1.json" > "$RUNNER_TEMP/base-v1.json"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-v1.json" packages/contracts/openapi/v1.json --fail-on ERR
